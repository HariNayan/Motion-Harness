<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Harness</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'8'%20fill%3D'%231c1d1f'%2F%3E%3Cg%20transform%3D'translate(4%204)'%20fill%3D'none'%20stroke%3D'white'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Crect%20x%3D'3'%20y%3D'4'%20width%3D'18'%20height%3D'16'%20rx%3D'2'%2F%3E%3Cpath%20d%3D'M7%204v16M17%204v16M3%209h4M3%2015h4M17%209h4M17%2015h4'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
  <script>try { const t = localStorage.getItem("mh-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="ws"><span class="ws-logo" data-icon="film"></span><span class="t">Motion Harness</span><span class="sub">local</span></div>
      <button class="quick" id="quick" type="button"><span data-icon="search"></span><span class="l">Search or jump</span><kbd>Ctrl K</kbd></button>
      <nav id="nav" aria-label="Sections">
        <a href="#/home" data-page="home"><span data-icon="home"></span><span class="lbl">Home</span></a>
        <a href="#/projects" data-page="projects"><span data-icon="folder"></span><span class="lbl">Projects</span><span class="count" id="count-projects"></span></a>
        <a href="#/runs" data-page="runs"><span data-icon="activity"></span><span class="lbl">OpenCode runs</span><span class="count hot" id="count-runs"></span></a>
        <div class="nav-label">Setup</div>
        <a href="#/settings" data-page="settings"><span data-icon="settings"></span><span class="lbl">Connection</span></a>
      </nav>
      <div class="health" id="health"></div>
      <div class="theme-switch" role="radiogroup" aria-label="Appearance">
        <button type="button" data-theme-set="light" role="radio"><span data-icon="sun"></span><span class="tx">Light</span></button>
        <button type="button" data-theme-set="dark" role="radio"><span data-icon="moon"></span><span class="tx">Dark</span></button>
        <button type="button" data-theme-set="system" role="radio"><span data-icon="monitor"></span><span class="tx">Auto</span></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content" id="main"></div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
